apiVersion: v1
kind: Pod
metadata:
  name: employee-record-app
  labels:
    app: employee-record
spec:
  containers:
    - name: employee-record-container
      image: docker.io/jilla5858/employeeappimage:latest
      ports:
        - containerPort: 8080
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
      resources:
        limits:
          memory: "512Mi"
          cpu: "500m"
        requests:
          memory: "256Mi"
          cpu: "250m"
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 30
  restartPolicy: Always
